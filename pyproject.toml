[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeclip"
version = "0.2.3"
description = "A TUI tool to copy codebase to clipboard"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "textual>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
codeclip = "tui.main:run"

[tool.setuptools.packages.find]
include = ["tui*"]
